name: CFBD quota check (temporary)

# Reads how many CFBD calls are left this month. Temporary: delete after use.
on:
  push:
    branches: [claude/sleepy-noether-tbnm6j]
    paths: [".github/workflows/cfbd-info.yml"]
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remaining CFBD calls
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.collegefootballdata.com/info",
                                       headers={"Authorization": "Bearer " + os.environ["CFBD_API_KEY"]})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("CFBD_INFO", json.dumps(json.load(r)))
          PY
