name: Forecast snapshots

# Independent of CFBD: asks the National Weather Service (Open-Meteo as a fallback) for the forecast at each
# upcoming game's venue and stores a NEW timestamped row. Rows are never overwritten.
# Every 6 hours, Tuesday through Saturday, in season (UTC).
on:
  schedule:
    - cron: "23 1,7,13,19 * 8-12,1 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull forecasts
        run: python -m pipeline.forecast
      - name: Commit snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts.sqlite data/cache/nws_points.json   # a small separate file: frequent commits stay cheap
          if git diff --cached --quiet; then
            echo "No new snapshots."
            echo "- **Data commit:** none." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Forecast snapshots ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase --autostash
            git push
            echo "- **Data commit:** snapshots pushed to main." >> "$GITHUB_STEP_SUMMARY"
          fi
