name: Incremental data ingest

# Runs on the DEFAULT branch (GitHub only fires schedules there), so this starts
# working once this PR is merged. Times are UTC.
on:
  push:                       # TEMPORARY: review-branch run; remove before merge
    branches: [claude/sleepy-noether-tbnm6j]
    paths: [".github/workflows/ingest.yml"]
  schedule:
    - cron: "17 9 * * 1"        # weekly, Mondays ~5:17 AM Eastern, all year
    - cron: "43 9 * 8-12 *"     # daily, August through December (football season)
  workflow_dispatch:            # "Run workflow" button for manual runs

permissions:
  contents: write               # needed to commit the updated data

# Never let two runs write the database at once.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Incremental ingest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m pipeline.run_all --resolve-if-missing
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports config/opponents.yaml
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
