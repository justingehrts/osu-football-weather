name: Incremental data ingest

# Full incremental ingest, run by hand when you want one (e.g. after un-deferring a team).
on:
  workflow_dispatch:            # manual only: the in-season schedule now lives in refresh.yml (1 CFBD call per run)

permissions:
  contents: write               # needed to commit the updated data

# Never let two runs write the database at once.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Incremental ingest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        # The weekly run also asks CFBD for its own call count (1 call); daily runs trust our counter.
        # A plan over the "ask the owner" size, or one that would pass the monthly cap, stops here.
        run: python -m pipeline.run_all ${{ github.event.schedule == '17 9 * * 1' && '--sync' || '' }}
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports config/opponents.yaml   # data/ includes the raw CFBD cache and call counter
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
