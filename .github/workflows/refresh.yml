name: Refresh history after new games (in season)

# Saturday night through Monday (Eastern), during the season. Times are UTC: Sunday 07:17 UTC is 3:17 AM
# Eastern, just after Saturday night games end; then Sunday and Monday afternoon/evening for stragglers.
# Each run makes ONE CFBD call ("any new completed games?"). Only if there are new games does it fetch their
# box scores and PPA, refresh this season's SP+ ratings (one call), pull the airport weather windows and
# recompute the summary tables. A quiet run commits nothing.
on:
  schedule:
    - cron: "17 7,19 * 8-12,1 0,1"   # Sun & Mon at 07:17 and 19:17 UTC, Aug-Dec and Jan
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history          # never two history refreshes at once (forecasts have their own group)
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (pipeline only)
        run: python -m pytest -q tests/test_pipeline.py tests/test_forecast.py
      - name: Any new completed games? (1 CFBD call) -> refresh if so
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m pipeline.refresh
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports    # data/ includes the raw CFBD cache, the call counter and the database
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "- **Data commit:** none (no files changed)." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh history after new games ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
            echo "- **Data commit:** pushed to main ($(git diff --name-only HEAD~1 HEAD | wc -l) files)." >> "$GITHUB_STEP_SUMMARY"
          fi
