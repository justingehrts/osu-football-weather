# Tune freely; re-run the pipeline after changes.
wind:        # applies to the game window, mph
  calm:     {sustained_max: 9,  gust_max: 19}
  moderate: {sustained_max: 14, gust_max: 24}
  windy:    {sustained_min: 15, or_gust_min: 25}
precip:
  none:     {total_in_max: 0.0}
  light:    {total_in_max: 0.10}
  steady:   {total_in_min: 0.10}
  snow_flag: true          # separate flag, not folded into the others
temperature:  # degrees F, game-window mean
  cold: {max: 39}
  mild: {min: 40, max: 69}
  warm: {min: 70, max: 84}
  hot:  {min: 85}
confidence:
  suppress_below_n: 5
  thin_below_n: 10
game_window_hours: 3.5

# --- added in milestone 1 (pipeline quality rules) ---
quality:
  far_station_miles: 25      # flag venues whose nearest ASOS is farther than this
  min_obs_in_window: 3       # fewer observations than this => weather not trusted
flags:
  covid_seasons: [2020]      # kept in the data, but filterable

# --- added in milestone 2 (statistics refinement) ---
merged_bins:        # extra, wider bins built from the originals above; the originals stay available
  precip:      {wet: [light, steady]}
  temperature: {warm_hot: [warm, hot]}
stats:
  ci_level: 0.90                 # confidence level for every delta's interval
  bootstrap_resamples: 2000
  bootstrap_seed: 20261028       # fixed so re-running the pipeline gives identical intervals
  min_games_for_adjustment: 20   # need at least this many games to fit the opponent-strength line

# --- added in milestone 3 (scaling + controlled model + call budget) ---
cfbd:
  free_tier_monthly_limit: 1000   # what CFBD allows on the free plan
  monthly_cap: 600                # OUR hard stop: a run aborts if it would take the month's total past this
  ask_if_plan_exceeds: 500        # a plan bigger than this must be approved by the owner first
  current_season_ttl_hours: 20    # in-season responses can change, so they may be re-requested after this
  week_vs_team_slack: 1.25        # use by-week requests unless they cost >25% more calls than by-team
  load_history_for_non_fbs: false # FCS opponents: keep the games, skip their (rarely available) history
controls:                         # the "controlled" model: opponent strength + month + home/away
  month_buckets: {oct: [10], nov: [11], dec_jan: [12, 1, 2]}   # Aug-Sep is the baseline bucket
  ridge: 0.000001                 # tiny stabiliser so an empty bucket can't break the fit
  bootstrap_resamples: 1000
tiers:
  lean_min_z: 1.0                 # a "lean" must be at least ~1 standard error in size (else coin-flip signs count)
iem:
  chunk_years: 4                  # one ASOS request covers this many seasons per station
report:
  new_venues_since: "2026-10-28"  # venues first seen on/after this date are marked NEW in the report

# --- added in milestone 4 (forecast + app) ---
forecast:
  horizon_hours: 156              # NWS hourly grid reaches ~6.5 days; a game further out gets "beyond the forecast horizon"
  precip_prob_middle: [30, 70]    # % chance of rain: below = dry, above = wet, in between = show BOTH side by side
  min_window_coverage: 0.75       # if the forecast covers less than this share of the game window, treat it as beyond the horizon
  min_hours_between_snapshots: 3  # re-running the job within this window doesn't add a duplicate row
  min_hours_between_beyond_horizon_rows: 24
  borderline:                     # how close to a bin line counts as "borderline" (a small forecast change could flip the card)
    wind_mph: 2
    gust_mph: 3
    rain_in: 0.03
    rain_chance_pct: 10
    temp_f: 2
  user_agent: "osu-football-weather (https://github.com/justingehrts/osu-football-weather)"
app:
  clear_signal_min_n: 30          # "Clear signal" needs the pipeline's CLEAR tier AND at least this many games
  headline_metrics: [pass_eff, points, points_allowed]   # shown on the card for everyone
  under_the_hood_metrics: [ppa_off]                      # shown in the "Under the hood" expander for the stats crowd
  playcalling_metrics: [pass_rate, plays]                # how they call plays (neutral: not better or worse), in its own block
